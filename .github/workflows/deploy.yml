name: Deploy festival games
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  DEPLOY_PATH: /opt/honkai-chat
  NODE_VERSION: "22"
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test story, multiplayer and hosting
        run: npm test
      - name: Build both pages
        run: npm run build
      - name: Assemble runtime release
        run: |
          mkdir -p release/client release/games/robots release/scripts
          cp package.json package-lock.json ecosystem.config.cjs release/
          cp -r server release/
          cp client/package.json release/client/
          cp -r client/dist release/client/
          cp games/robots/package.json release/games/robots/
          cp -r games/robots/dist games/robots/server games/robots/shared release/games/robots/
          cp scripts/smoke-host.mjs scripts/activate-release.sh release/scripts/
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}
      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts
      - name: Upload versioned release
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'mkdir -p /opt/honkai-chat/releases/${{ github.sha }}'
          rsync -az release/ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:${{ env.DEPLOY_PATH }}/releases/${{ github.sha }}/
      - name: Activate on the existing port and verify both games
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash /opt/honkai-chat/releases/${{ github.sha }}/scripts/activate-release.sh ${{ github.sha }}'
