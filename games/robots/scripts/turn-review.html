<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Механический разворот · review</title>
<style>body{margin:0;background:#15232b;color:#e8e3d7;font:12px system-ui}canvas{position:fixed;inset:0}header,footer{position:fixed;left:8px;right:8px;z-index:2;display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:6px;background:#101c25de}header{top:8px}footer{bottom:8px}button,select{padding:6px;color:inherit;border:1px solid #667875;background:#24353b}input[type=range]{flex:1;min-width:80px}label{display:flex;gap:4px;align-items:center}#readout{position:fixed;right:16px;top:54px;background:#101c25bb;padding:7px;white-space:pre;font:11px monospace;pointer-events:none}.quiet header>*:not(#panel),.quiet #readout{display:none}.quiet header{left:auto}#clock{min-width:96px}@media(max-height:500px){body{font-size:10px}button,select{padding:4px;font-size:10px}#readout{font-size:9px}}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body>
<header><select id="case" aria-label="Эпизод"><option value="back">Бросок через спину</option><option value="crossing">Прыжок через соперника</option><option value="punish">Удар после смены стороны</option></select><button id="start">Начало поворота</button><button id="middle">Перенос опоры</button><button id="end">Новая стойка</button><button id="facing">Развернуть</button><button id="camera">Крупный план</button><label><input id="reduced" type="checkbox">Спокойно</label><button id="panel">Панель</button></header>

<script type="module">

const $=id=>document.getElementById(id),scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true});
scene.background=new THREE.Color('#18222b');renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.34;renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
