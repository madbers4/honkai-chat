<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мастерская · роботы Белобога</title><link rel="stylesheet" href="../src/customization-ui.css"><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><style>html,body{margin:0;min-height:100%;background:#0d181e;color:#eae3d4;font-family:Arial,sans-serif}body{padding:28px;box-sizing:border-box}main{max-width:1110px;margin:0 auto}nav{display:flex;align-items:center;gap:12px;margin:0 0 16px}nav h1{font:500 23px Georgia,serif;flex:1;margin:0}nav a,nav button{color:#dcc292;font-size:12px;background:#213139;border:1px solid #60716d;padding:9px 12px;border-radius:6px;text-decoration:none;cursor:pointer}#host{height:530px}#host>.customization-workshop{height:100%}output{display:block;font:12px monospace;margin:16px 0;color:#8fa5aa}iframe{width:844px;height:390px;border:1px solid #b09b63;border-radius:12px;background:#19272d}body.embedded{padding:6px;overflow:hidden;height:100vh}body.embedded main,body.embedded #host{height:100%}body.embedded nav,body.embedded output{display:none}.device-note{font-size:12px;color:#9cacae;margin:16px 0 10px}</style></head><body><main><nav><h1>Мастерская Белобога</h1><a href="?mobile=1">Телефон 844 × 390</a><a href="?reduced=1">Меньше движения</a><a href="?low=1">Лёгкий режим</a><button id="reset">Сбросить</button></nav><div id="host"></div><output></output></main><script type="module">
import{createCustomizationUI}from'../src/customization-ui.js';
const query=new URLSearchParams(location.search),embedded=query.has('embedded');document.body.classList.toggle('embedded',embedded);

  document.querySelector('#host').remove();document.querySelector('output').remove();
  const p=document.createElement('p');p.className='device-note';p.textContent='Реальный viewport документа 844 × 390. Все элементы доступны пальцем и с клавиатуры.';document.querySelector('main').append(p);

</script></body></html>
