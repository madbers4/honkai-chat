<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Белобог · Animation review</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#0c161b;color:#e3eade;font:12px Arial,sans-serif}#stage{position:fixed;inset:0}header{position:fixed;top:0;left:0;right:0;background:#0a151de8;padding:10px 14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}button{background:#26383b;color:#e7ecde;border:1px solid #60736f;padding:8px 11px;cursor:pointer;font:inherit}button.active{color:#192625;background:#b8e5d1;border-color:#c8ffee}header>small{width:100%;color:#a9c3b9;letter-spacing:1.4px}footer{position:fixed;bottom:0;left:0;right:0;padding:10px 14px;background:#0a151de8;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#readout{margin-left:auto;color:#c8e9d9;font:11px/1.5 monospace;white-space:pre-line}#legend{position:fixed;left:18px;top:100px;padding:10px;background:#0a151dc4;line-height:1.7;color:#bad0c7;pointer-events:none}label{display:flex;align-items:center;gap:5px;padding:3px 8px}a{color:#b7dddb}.slim #legend{display:none}.slim header small,.slim header button:not(#panel){display:none}
@media(max-height:500px){header{padding:6px;gap:4px}button{font-size:10px;padding:6px 8px}header>small{font-size:8px}footer{font-size:9px;padding:6px;gap:4px}#readout{font-size:9px}#legend{font-size:9px;top:92px;left:12px;padding:7px}}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="stage"></div>
<header><small>СТЕНД ОТОБРАЖЕНИЯ · реальные модель, риг, материалы и эффекты · диагностические состояния</small>
<button data-case="idle">Ожидание</button><button data-case="walk">Походка</button><button data-case="block">Защита</button><button data-case="parry">Парирование</button><button data-case="guardBreak">Слом защиты</button><button data-case="grab">Захват / бросок</button><button data-case="tech">Разрыв захвата</button><button data-case="burst">Аварийный сброс</button><button data-case="airburst">Сброс в воздухе</button><button data-case="feint">Ложный замах</button><button data-case="ultimate">Перегрузка</button><button data-case="ko">Отключение</button><button id="panel">Панель</button></header>
<div id="legend">Обе линзы — здоровье<br>Реактор — цвет игрока / заряд<br>Фонари освещают окружение</div>
<footer><span>ИСКРА:</span><button data-hp="100">100 HP</button><button data-hp="55">55 HP</button><button data-hp="18">18 HP</button><button id="damage">−20 HP / удар</button><button id="reset">Новый раунд</button><button id="pause">Пауза</button><label><input id="reduced" type="checkbox">Спокойные эффекты</label><label><input id="low" type="checkbox">Низкое качество</label><div id="readout"></div></footer>
<script type="module">
import { createArena } from '/src/arena.js';
import { robotPresentation } from '/shared/robot-presentation.js';
const $=id=>document.getElementById(id);
const arena=await createArena($('stage'));
let scenario='idle', hp=100, elapsed=0, playing=true, round=1, last=performance.now(), eventId=1, cycle=-1, seekRevision=0;
const fired=new Set(); const manualEvents=[];
const periods={idle:10,walk:8,block:3,parry:1.8,guardBreak:2,grab:2.8,tech:2.6,burst:2.4,airburst:2.4,feint:2,ultimate:3.6,ko:9999};
const freshPlayer=(id,skin,x,facing,health)=>({id,skin,x,y:0,vx:0,vy:0,facing,hp:health,energy:65,guard:100,action:'idle',variant:'',actionTime:0,actionDuration:0,cooldowns:{dash:0,special:0,burst:0,ultimate:0}});
function stateAt(t){
 const period=periods[scenario], local=t%period, index=Math.floor(t/period);
 if(index!==cycle){cycle=index;fired.clear();}
 const a=freshPlayer('p1','amber',-1.65,1,scenario==='ko'?0:hp),b=freshPlayer('p2','cyan',1.65,-1,scenario==='ko'?100:18);
 const events=manualEvents.splice(0);
 const event=(key,at,type,source=a,target=b,extra={})=>{if(playing&&local>=at&&!fired.has(key)){fired.add(key);events.push({id:eventId++,type,player:source.id,target:target.id,x:target.x,y:target.y+1.1,...extra});}};
 const act=(p,action,variant,time,duration)=>Object.assign(p,{action,variant,actionTime:time,actionDuration:duration});
 if(scenario==='walk'){const move=Math.sin(t*1.5)*.65;a.x+=move;b.x+=move;a.vx=b.vx=Math.cos(t*1.5)*.975;act(a,'walk','',t,0);act(b,'walk','',t,0);}
 if(scenario==='block'){act(a,'block','',t,0);act(b,'block','',t,0);}
 if(scenario==='parry'&&local<.5){act(a,'block','parry',local,.22);act(b,'hit','parried',local,.42);event('parry',0,'parry');}
 if(scenario==='guardBreak'&&local<.8){act(a,'hit','guardBreak',local,.8);a.guard=0;event('guardBreak',0,'guardBreak',b,a);}
 if(scenario==='grab'||scenario==='tech'){
  a.x=-1.06;b.x=1.06;
  const release=scenario==='tech'?.39:.56;
  if(local<release+.3){act(a,'heavy','grab',local,.86);a.grabCatchTime=local>=.26?.26:null;}
  if(local>=.26&&local<release){a.grabTarget='p2';a.grabHoldTime=b.grabHoldTime=local-.26;act(b,'hit','grabbed',local-.26,.3);b.grabbedBy='p1';b.grabTechWindow=Math.max(0,.24-b.grabHoldTime);}
  event('catch',.26,'grab',a,b,{duration:.3,techWindow:.24});
  if(local>=release&&local<release+.48){
   const r=local-release;
   if(scenario==='tech'){act(a,'hit','grabBreak',r,.25);act(b,'hit','grabBreak',r,.25);a.x-=r*.9;b.x+=r*.9;event('tech',release,'grabBreak',b,a,{x:0,reason:'tech',duration:.25});}
   else{a.grabReleaseTime=.56;a.grabHoldTime=.3;act(b,'hit','thrown',r,.48);b.x+=Math.min(1,r*3.2);b.y=Math.max(0,3.4*r-11.5*r*r);b.vy=b.y>0?3.4-23*r:0;event('throw',release,'throw',a,b,{damage:15,duration:.48});}
  }
 }
 if((scenario==='burst'||scenario==='airburst')&&local<.65){
  act(a,'special','burst',local,.5);a.burstInvulnerable=Math.max(0,.22-local);act(b,'hit','burstRepelled',local,.28);b.x+=Math.min(local, .28)*2;
  if(scenario==='airburst'){a.y=Math.max(0,1.25+1.5*local-11.5*local*local);a.vy=a.y>0?1.5-23*local:0;}
  event('burst',0,'burst',a,b,{x:a.x,y:a.y+1.1,radius:3.4,duration:.5});
 }
 if(scenario==='feint'&&local<.5){if(local<.13)act(a,'heavy','',local,.81);else{act(a,'dash','feint',local-.13,.3);a.x-=Math.min(local-.13,.2)*4.8;a.vx=local<.33?-4.8:0;event('feint',.13,'feint',a,b,{x:a.x,duration:.3,facing:1});}}
 if(scenario==='ultimate'&&local<1.8){a.energy=100;act(a,'ultimate','overload',local,1.8);event('charge',0,'ultimate',a,b,{x:a.x,y:1.35,variant:'overload'});[.7,1,1.3].forEach((at,pulse)=>event('pulse'+pulse,at,'ultimatePulse',a,b,{x:a.x,y:1.35,pulse,facing:1,range:5.2,variant:'overload'}));}
 if(scenario==='ko'){act(a,'ko','',t,99);act(b,'victory','',t,99);event('ko',0,'ko',a,a,{winner:'p2'});}
 return {room:'ANIMATION_LAB',round,visualSeekToken:`${round}:${scenario}:${hp}:${seekRevision}`,phase:playing?(scenario==='ko'?'roundOver':'fight'):'paused',time:60,players:[a,b],events,projectiles:[]};
}
function select(value){scenario=value;elapsed=0;cycle=-1;seekRevision++;fired.clear();arena.update(null,null);document.querySelectorAll('[data-case]').forEach(b=>b.classList.toggle('active',b.dataset.case===value));}
document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>select(b.dataset.case));
document.querySelectorAll('[data-hp]').forEach(b=>b.onclick=()=>{hp=Number(b.dataset.hp);});
$('damage').onclick=()=>{hp=Math.max(1,hp-20);manualEvents.push({id:eventId++,type:'hit',player:'p2',target:'p1',x:-1.65,y:1.1,damage:20,action:'heavy'});};
$('reset').onclick=()=>{round++;hp=100;select('idle');};
$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'Пауза':'Продолжить';};
$('reduced').onchange=()=>arena.setReducedMotion($('reduced').checked);
$('low').onchange=()=>arena.setQuality($('low').checked?'low':'high');
$('panel').onclick=()=>document.body.classList.toggle('slim');
select('idle');
function loop(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(playing)elapsed+=dt;const state=stateAt(elapsed);arena.update(state,'p1');const a=state.players[0],signal=robotPresentation(a,elapsed,{reducedMotion:$('reduced').checked}),fx=arena.getDamageStats?.();$('readout').textContent=`${a.hp} HP · ${signal.healthBand} · ${signal.status}\n${a.action}/${a.variant||'—'} · ${elapsed.toFixed(1)}s${fx?`\nFX ${fx.sparkActive}/${fx.sparkCapacity} · дым ${fx.smokeActive}/${fx.smokeCapacity} · разряды ${fx.electricalActive}/${fx.arcCapacity} · сбои ${fx.ambientFaults} · пороги ${fx.thresholdVents} · KO ${fx.koDischarges}`:''}`;requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
