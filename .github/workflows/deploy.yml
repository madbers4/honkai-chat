name: Deploy static festival game

on:
  push:
    branches: [main]

env:
  DEPLOY_PATH: /opt/honkai-chat
  NODE_VERSION: "20"

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Test game rules
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Upload static site
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'mkdir -p /opt/honkai-chat/client/dist'
          rsync -avz --delete \
            client/dist/ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:${{ env.DEPLOY_PATH }}/client/dist/

      - name: Serve static files on the existing port
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd /opt/honkai-chat
            pm2 delete honkai-chat || true
            pm2 serve /opt/honkai-chat/client/dist 3001 --spa --name honkai-chat
            pm2 save
            curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:3001/ >/dev/null
          EOF
