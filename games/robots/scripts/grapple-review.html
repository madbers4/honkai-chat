<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Белобог · Захват · review</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:#efe5d3;background:#0b1519;font:12px Arial,sans-serif}#stage{position:fixed;inset:0}header,footer{position:fixed;left:0;right:0;padding:10px 14px;background:#08151ce8;display:flex;align-items:center;gap:7px;flex-wrap:wrap}header{top:0}footer{bottom:0}header>small{width:100%;color:#a5bfb5;letter-spacing:1px}button{background:#26373a;border:1px solid #687d74;color:#ede7d3;padding:8px 10px;cursor:pointer;font:inherit}.active{background:#dec18c;color:#182325}#scrub{flex:1;min-width:100px}#clock{width:60px;font:12px monospace}#readout{position:fixed;left:15px;top:110px;background:#07161bc4;padding:10px;font:11px/1.65 monospace;white-space:pre;pointer-events:none}.quiet header>small,.quiet header button:not(#panel),.quiet #readout{display:none}label{display:flex;gap:4px;align-items:center;font-size:10px}.check{margin-left:auto}

<body><div id="stage"></div><header><small>ЗАХВАТ / КОНТАКТ / ДВА УДАРА · РЕАЛЬНАЯ БОЕВАЯ СИМУЛЯЦИЯ · ДИАГНОСТИЧЕСКАЯ СТАРТОВАЯ РАССТАНОВКА</small><div id="cases" style="display:contents"></div><label>Дистанция <select id="distance" aria-label="Стартовая дистанция"><option value="1.8">1.8</option><option value="2.1" selected>2.1</option><option value="2.45">2.45</option></select></label><button id="panel">Панель</button></header>
<pre id="readout"></pre><pre id="pair-readout" style="position:fixed;right:12px;top:110px;background:#07161bc4;padding:9px;font:10px/1.5 monospace;pointer-events:none"></pre><footer><button id="play">Пауза</button><button id="replay">Повтор</button><button id="speed">Скорость ×1</button><button id="previous">−1 кадр</button><button id="next">+1 кадр</button><button id="contact">Следующий контакт</button><button id="rupture" hidden>Момент взрыва</button><button id="facing">Развернуть</button><input id="scrub" aria-label="Кадр боя" type="range" min="0" value="0"><span id="clock"></span><label class="check"><input id="reduced" type="checkbox">Спокойно</label><label><input id="low" type="checkbox">Низкое качество</label></footer>
<script type="module">
import { createArena } from '/src/arena.js';
import { buildGrappleCase,GRAPPLE_CASES } from '/scripts/grapple-cases.js';
const $=id=>document.getElementById(id), arena=await createArena($('stage'));
let data,selected='two',at=0,playing=true,last=performance.now(),accumulator=0,seekToken=0,facing=1,contactIndex=-1,rate=1;
const firstFrame=new Map();
for(const [key,title] of Object.entries(GRAPPLE_CASES)){const button=document.createElement('button');button.dataset.case=key;button.textContent=title;button.onclick=()=>choose(key);$('cases').append(button);}
function show(frame,seek=false){at=Math.max(0,Math.min(data.snapshots.length-1,frame));const state=data.snapshots[at];if(seek){arena.update(null,null);seekToken++;}const events=playing?state.events.filter(event=>firstFrame.get(event.id)===at):[];
arena.update({...state,phase:playing?state.phase:'paused',events,visualSeekToken:seekToken},'p1');$('scrub').value=at;$('clock').textContent=(at/60).toFixed(2)+'s';
$('readout').textContent=state.players.map(p=>`${p.name}: ${p.action}/${p.variant||'—'}  ${p.hp}HP  Y${p.y.toFixed(2)}  hold=${(p.grabHoldTime||0).toFixed(2)} strike=${p.grabStrikeTime?.toFixed(3)??'—'} throw=${p.grabThrowTime?.toFixed(3)??'—'}`).join('\n')+`\n${state.phase} · ${state.players[0].wins}:${state.players[1].wins}`+(state.finish?` · ${state.finish.type}/${state.finish.stage}`:'')+'\n'+state.events.slice(-5).map(e=>`${e.type} ${e.variant||''} ${e.damage||''}`).join('\n');}
function choose(key){selected=key;data=buildGrappleCase(key,facing,Number($('distance').value));firstFrame.clear();for(const event of data.events)firstFrame.set(event.id,event.frame);$('scrub').max=data.snapshots.length-1;$('rupture').hidden=!data.events.some(e=>e.type==='destruction');at=0;contactIndex=-1;accumulator=0;playing=true;$('play').textContent='Пауза';arena.update(null,null);seekToken++;document.querySelectorAll('[data-case]').forEach(b=>b.classList.toggle('active',b.dataset.case===key));show(0);}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Пауза':'Продолжить';if(at>=data.snapshots.length-1&&playing)choose(selected);else show(at);};
$('replay').onclick=()=>choose(selected);$('distance').onchange=()=>choose(selected);$('speed').onclick=()=>{rate=rate===1?.25:1;$('speed').textContent='Скорость ×'+rate};for(const [id,step]of [['previous',-1],['next',1]])$(id).onclick=()=>{playing=false;$('play').textContent='Продолжить';show(at+step,true);};$('panel').onclick=()=>document.body.classList.toggle('quiet');
$('contact').onclick=()=>{playing=false;$('play').textContent='Продолжить';if(data.contacts.length){contactIndex=(contactIndex+1)%data.contacts.length;show(data.contacts[contactIndex].frame,true);}};
$('rupture').onclick=()=>{const event=data.events.find(e=>e.type==='destruction');if(!event)return;playing=true;accumulator=0;$('play').textContent='Пауза';show(event.frame-3,true);};
$('facing').onclick=()=>{facing*=-1;choose(selected);};$('scrub').oninput=()=>{playing=false;$('play').textContent='Продолжить';show(Number($('scrub').value),true);};
$('reduced').onchange=()=>arena.setReducedMotion($('reduced').checked);$('low').onchange=()=>arena.setQuality($('low').checked?'low':'high');
choose('two');function loop(now){const dt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;if(playing){accumulator+=dt*rate;while(accumulator>=1/60){accumulator-=1/60;if(at<data.snapshots.length-1)show(at+1);else{playing=false;$('play').textContent='Продолжить';show(at);break;}}}$('pair-readout').textContent=arena.getGrappleStats().map(p=>`${p.id} · render: facing ${p.facing} yaw ${p.yaw.toFixed(3)}\nroot ${p.rootX.toFixed(3)} → partner ${p.partnerX?.toFixed(3)}\nL ${p.leftClaw.map(n=>n.toFixed(3)).join(' / ')}\nR ${p.rightClaw.map(n=>n.toFixed(3)).join(' / ')}`).join('\n');requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></body></html>
