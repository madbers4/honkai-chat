<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Белобог · Импульс · review</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0;background:#10191d;color:#ede5d4;font:12px Arial}#stage{position:fixed;inset:0}header,footer{position:fixed;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px;background:#10191deb;flex-wrap:wrap}header{top:0}footer{bottom:0}button,select{background:#334345;color:inherit;border:1px solid #74837c;padding:7px;font:inherit}#scrub{flex:1;min-width:120px}#info{position:fixed;top:55px;left:14px;white-space:pre;background:#10191dcc;padding:8px}label{display:flex;align-items:center;gap:4px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body>
<div id="stage"></div><header><b>ИМПУЛЬС · реальные запуск и попадание CombatRoom</b><select id="variant" aria-label="Способность"><option value="bolt">Импульс</option><option value="shockwave">Волна — контроль</option></select><button id="facing">Развернуть</button><button id="skin">Цвет команды</button><label><input id="block" type="checkbox">Блок</label></header><pre id="info"></pre>
<footer><button id="play">Пауза</button><button id="replay">Повтор</button><button id="flight">В полёте</button><button id="impact">Попадание</button><input id="scrub" aria-label="Кадр боя" type="range" min="0" max="129" value="0"><span id="clock"></span><label><input id="low" type="checkbox">Низкое качество</label><label><input id="reduced" type="checkbox">Спокойно</label></footer>
<script type="module">
import {createArena} from '/src/arena.js'; import {buildProjectileCase} from '/scripts/projectile-review.js';
const $=id=>document.getElementById(id), arena=await createArena($('stage'));
let facing=1,skin='amber',data,at=0,playing=true,last=performance.now(),accumulator=0,seekToken=0;
const firstFrame=new Map();
function show(frame,seek=false){at=Math.max(0,Math.min(129,frame));const s=data.snapshots[at];if(seek){arena.update(null,null);seekToken++;}arena.update({...s,phase:playing?s.phase:'paused',events:playing?s.events.filter(e=>firstFrame.get(e.id)===at):[],visualSeekToken:seekToken},'p1');$('scrub').value=at;$('clock').textContent=(at/60).toFixed(2)+'с';$('info').textContent=`Кадр ${at} · запуск ${data.flight} · контакт ${data.contact}\n${s.projectiles.map(p=>`${p.variant} x=${p.x.toFixed(2)} y=${p.y.toFixed(2)} dir=${p.direction}`).join('\n')}\n${s.players.map(p=>p.name+' '+p.hp+' HP').join(' / ')}`;}
function reset(){data=buildProjectileCase({facing,skin,variant:$('variant').value,block:$('block').checked});firstFrame.clear();for(const e of data.events)firstFrame.set(e.id,e.frame);playing=true;at=0;accumulator=0;seekToken++;arena.update(null,null);$('play').textContent='Пауза';show(0);}
function pose(frame){playing=false;$('play').textContent='Продолжить';show(frame,true);}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Пауза':'Продолжить';show(at);};$('replay').onclick=reset;$('flight').onclick=()=>pose(data.flight+16);$('impact').onclick=()=>pose(data.contact??80);$('scrub').oninput=()=>pose(Number($('scrub').value));$('facing').onclick=()=>{facing*=-1;reset();};$('skin').onclick=()=>{skin=skin==='amber'?'cyan':'amber';reset();};$('variant').onchange=reset;$('block').onchange=reset;$('low').onchange=()=>arena.setQuality($('low').checked?'low':'high');$('reduced').onchange=()=>arena.setReducedMotion($('reduced').checked);
reset();function loop(now){const dt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;if(playing){accumulator+=dt;while(accumulator>=1/60){accumulator-=1/60;if(at<129)show(at+1);else{playing=false;$('play').textContent='Продолжить';show(at);break;}}}requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></body></html>
