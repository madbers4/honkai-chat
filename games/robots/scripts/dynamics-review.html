<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Динамика камеры · review</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0;background:#142028;color:#ece4d3;font:12px system-ui}#stage{position:fixed;inset:0}header,footer{position:fixed;left:8px;right:8px;padding:8px;display:flex;gap:7px;align-items:center;background:#10202be0;flex-wrap:wrap}header{top:8px}footer{bottom:8px}button,select{font:inherit;background:#283a43;color:inherit;border:1px solid #85938a;padding:7px}input[type=range]{flex:1;min-width:80px}label{display:flex;align-items:center;gap:4px}#readout{position:fixed;right:18px;top:65px;font:10px/1.6 monospace;background:#10202bb8;padding:8px;pointer-events:none}small{opacity:.7}@media(max-height:500px){header,footer{padding:5px;gap:4px}button,select{padding:5px;font-size:10px}#readout{top:54px;font-size:9px}}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body><div id="stage"></div>
<header><select id="case" aria-label="Сцена"><option value="heavy">Пробой / крюк / пресс</option><option value="backthrow">Бросок за спину</option><option value="slam">Пикирование</option><option value="air">Воздушная серия</option><option value="finish">Сорванное ядро</option></select><button id="comparison">ПОСЛЕ · направленный отклик</button><button id="facing">Развернуть</button><label><input id="reduced" type="checkbox">Спокойно</label><label><input id="low" type="checkbox">Низкое</label><small>Одинаковые snapshots настоящего CombatRoom</small></header>
<pre id="readout"></pre><footer><button id="play">Пауза</button><button id="replay">Повтор</button><button id="first">Первый контакт</button><button id="next">Следующий контакт</button><label><input id="hold" type="checkbox">Стоп на акценте</label><input id="scrub" type="range" aria-label="Кадр боя" min="0"><span id="clock"></span></footer>
<script type="module">
import {createArena} from '/src/arena.js';
import {buildHeavyCase} from '/scripts/heavy-review.js';
import {buildSlamCase} from '/scripts/slam-review.js';
import {buildV5Case} from '/scripts/combat-v5-cases.js';
const $=id=>document.getElementById(id), arena=await createArena($('stage'),{allowEffectReview:true});
let data,at=0,playing=true,facing=1,baseline=false,token=0,last=performance.now(),accumulator=0,stopAt=-1;const firstFrames=new Map();
function show(frame,seek=false){at=Math.max(0,Math.min(data.snapshots.length-1,frame));if(seek){arena.update(null,null);token++;}const state=data.snapshots[at];arena.update({...state,phase:playing?state.phase:'paused',events:playing?state.events.filter(e=>firstFrames.get(e.id)===at):[],visualSeekToken:token},'p1');$('scrub').value=at;$('clock').textContent=(at/60).toFixed(2)+'с';}
function choose(){const type=$('case').value;data=type==='heavy'?buildHeavyCase('series',facing):type==='slam'?buildSlamCase('apex',facing):buildV5Case(type,facing);firstFrames.clear();for(const e of data.events)firstFrames.set(e.id,e.frame);$('scrub').max=data.snapshots.length-1;playing=true;accumulator=0;stopAt=$('hold').checked?data.contacts[0].frame+4:-1;$('play').textContent='Пауза';arena.update(null,null);token++;show(0);}
function pause(frame){playing=false;$('play').textContent='Продолжить';show(frame,true);}
$('case').onchange=choose;$('replay').onclick=choose;$('facing').onclick=()=>{facing*=-1;choose();};$('comparison').onclick=()=>{baseline=!baseline;arena.setCameraReviewBaseline(baseline);$('comparison').textContent=baseline?'ДО · синусная тряска':'ПОСЛЕ · направленный отклик';choose();};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Пауза':'Продолжить';if(playing&&at===data.snapshots.length-1)choose();else show(at);};$('scrub').oninput=()=>pause(Number($('scrub').value));
$('first').onclick=()=>{playing=true;stopAt=$('hold').checked?data.contacts[0].frame+4:-1;$('play').textContent='Пауза';arena.update(null,null);token++;show(Math.max(0,data.contacts[0].frame-12));};$('next').onclick=()=>{const beat=data.contacts.find(e=>e.frame>at+2)||data.contacts[0];playing=true;stopAt=$('hold').checked?beat.frame+4:-1;$('play').textContent='Пауза';arena.update(null,null);token++;show(Math.max(0,beat.frame-12));};
$('reduced').onchange=()=>{arena.setReducedMotion($('reduced').checked);choose();};$('low').onchange=()=>arena.setQuality($('low').checked?'low':'high');choose();
function loop(now){const dt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;if(playing){accumulator+=dt;while(accumulator>=1/60){accumulator-=1/60;if(at<data.snapshots.length-1&&at!==stopAt)show(at+1);else{playing=false;$('play').textContent='Продолжить';show(at);break;}}}const stats=arena.getCameraStats(),f=stats.frame;$('readout').textContent=`${baseline?'Старая камера':'Пружинная камера'} · ${at} / ${data.snapshots.length-1}\nX ${f.x.toFixed(3)} Y ${f.y.toFixed(3)} D ${f.z.toFixed(3)}\nТолчки ${stats.activeImpulses} / 6\n${data.events.filter(e=>e.frame<=at&&e.frame>at-25&&['hit','throw','slam','destruction'].includes(e.type)).map(e=>e.variant||e.type).join(' · ')}`;requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></body></html>
